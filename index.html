<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pintar</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .card { background: #2d2d2d; padding: 20px; border-radius: 15px; width: 100%; max-width: 400px; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="color: #4ade80;">Semangat Pagi! ☀️</h2>
    <div id="jam" style="font-size: 24px; font-weight: bold; margin-bottom: 20px;">00:00:00</div>

    <input type="text" id="tugas" placeholder="Tambah tugas baru hari ini..." style="width: 70%; padding: 8px;">
    <button onclick="tambahTugas()" style="padding: 8px;">Tambah</button>

    <div id="listTugas" style="margin-top: 20px;"></div>

    <div style="margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.1);">
        <p style="margin: 0 0 10px 0; font-size: 14px; color: #a8b2d1;">🎵 Musik Relaksasi</p>
        <audio controls style="width: 100%; height: 35px;">
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
            Browser Anda tidak mendukung audio.
        </audio>
    </div>
</div>

<script>
    function updateJam() {
        document.getElementById('jam').innerText = new Date().toLocaleTimeString();
    }
    setInterval(updateJam, 1000);

    function tambahTugas() {
        let input = document.getElementById('tugas').value;
        if(input) {
            let div = document.createElement('div');
            div.innerHTML = input + ' <button onclick="this.parentElement.remove()">x</button>';
            document.getElementById('listTugas').appendChild(div);
            document.getElementById('tugas').value = '';
        }
    }
</script>

</body>
</html>
